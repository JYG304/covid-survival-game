<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>游戏启动测试</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #0f0;
    }
    .log {
      padding: 5px;
      border-left: 3px solid #0f0;
      margin: 5px 0;
    }
    .error {
      color: #f00;
      border-color: #f00;
    }
    .success {
      color: #0f0;
      border-color: #0f0;
    }
    .warning {
      color: #ff0;
      border-color: #ff0;
    }
  </style>
</head>
<body>
  <h1>🎮 游戏模块加载测试</h1>
  <div id="output"></div>
  <script type="module">
    const output = document.getElementById('output');

    function log(msg, type = 'log') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = msg;
      output.appendChild(div);
      console.log(msg);
    }

    log('开始测试游戏模块加载...', 'log');

    try {
      log('✓ 测试 1/10: 加载 gameState.js', 'log');
      const { gameState } = await import('./src/data/gameState.js');
      log(`✓ gameState 加载成功: 金钱=${gameState.money}`, 'success');

      log('✓ 测试 2/10: 加载 landmarks.js', 'log');
      const { landmarks } = await import('./src/data/landmarks.js');
      log(`✓ landmarks 加载成功: 共${landmarks.length}个地标`, 'success');

      log('✓ 测试 3/10: 加载 timeSystem.js', 'log');
      const { updateTimeFlow } = await import('./systems/timeSystem.js');
      log('✓ timeSystem 加载成功', 'success');

      log('✓ 测试 4/10: 加载 player.js', 'log');
      const { player } = await import('./src/game/player.js');
      log(`✓ player 加载成功: x=${player.x}, y=${player.y}`, 'success');

      log('✓ 测试 5/10: 加载 renderer.js', 'log');
      const renderer = await import('./src/game/renderer.js');
      log('✓ renderer 加载成功', 'success');

      log('✓ 测试 6/10: 加载 hud.js', 'log');
      const { updateHUD } = await import('./src/ui/hud.js');
      log('✓ hud 加载成功', 'success');

      log('✓ 测试 7/10: 加载 toast.js', 'log');
      const { showToast } = await import('./src/ui/toast.js');
      log('✓ toast 加载成功', 'success');

      log('✓ 测试 8/10: 加载 audio.js', 'log');
      const { audio } = await import('./src/utils/audio.js');
      log('✓ audio 加载成功', 'success');

      log('✓ 测试 9/10: 加载 actionSystem.js', 'log');
      const actions = await import('./src/systems/actionSystem.js');
      log('✓ actionSystem 加载成功', 'success');

      log('✓ 测试 10/10: 加载 deepGameplayIntegration.js', 'log');
      const deep = await import('./src/systems/deepGameplayIntegration.js');
      log('✓ deepGameplayIntegration 加载成功', 'success');

      log('\n========================================', 'success');
      log('✅ 所有模块加载成功！游戏代码没有问题！', 'success');
      log('========================================\n', 'success');

      log('现在请访问: http://localhost:8888', 'warning');
      log('如果游戏画面出现问题，按F12查看控制台错误', 'warning');

    } catch (err) {
      log(`\n❌ 错误: ${err.message}`, 'error');
      log(`详细信息: ${err.stack}`, 'error');
    }
  </script>
</body>
</html>
