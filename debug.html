<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏调试版 - 带控制台输出</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .font-code { font-family: 'JetBrains Mono', monospace; }
    #gameCanvas {
      background: #1a1a2e; /* 添加明显的背景色用于调试 */
      image-rendering: pixelated;
    }
    #debugLog {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      max-width: 400px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #0f0;
      border-radius: 4px;
      z-index: 9999;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen overflow-hidden">

  <!-- 顶部UI栏 -->
  <header class="w-full bg-zinc-900/95 border-b border-zinc-800 px-3 py-1.5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div class="bg-zinc-950 px-2.5 py-1 rounded border border-zinc-700/80 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-sm font-code text-amber-300" id="clockDisplay">第 1 天 · 07:30</span>
      </div>
    </div>

    <div class="flex items-center gap-2 text-xs font-code">
      <div class="bg-zinc-950 px-2 py-0.5 rounded border border-emerald-500/30 text-emerald-400">
        💳 ¥<span id="resMoney">1,850</span>
      </div>
    </div>
  </header>

  <!-- 游戏画布区域 -->
  <main class="relative flex-1 w-full bg-zinc-950 overflow-hidden">
    <canvas id="gameCanvas" class="w-full h-full block"></canvas>

    <!-- 区域标签 -->
    <div class="absolute top-3 left-3 bg-zinc-900/90 px-3 py-1 rounded border border-zinc-700 text-xs text-zinc-200 z-10">
      🏠 出租单间
    </div>
  </main>

  <!-- 调试日志 -->
  <div id="debugLog">
    <div style="color: #ff0; margin-bottom: 5px;">🐛 调试控制台</div>
    <div id="logContent"></div>
  </div>

  <script type="module">
    const logEl = document.getElementById('logContent');

    function debugLog(msg, type = 'info') {
      const colors = {
        info: '#0ff',
        success: '#0f0',
        error: '#f00',
        warn: '#fa0'
      };
      const line = document.createElement('div');
      line.style.color = colors[type] || '#fff';
      line.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    debugLog('🚀 开始初始化游戏...', 'info');

    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
      debugLog('❌ Canvas元素未找到！', 'error');
    } else {
      debugLog(`✅ Canvas元素已获取`, 'success');
      debugLog(`Canvas尺寸: ${canvas.offsetWidth}x${canvas.offsetHeight}`, 'info');
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) {
      debugLog('❌ 2D上下文获取失败！', 'error');
    } else {
      debugLog('✅ 2D上下文已获取', 'success');
    }

    // 设置Canvas尺寸
    function resizeCanvas() {
      const oldW = canvas.width;
      const oldH = canvas.height;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      debugLog(`Canvas调整: ${oldW}x${oldH} → ${canvas.width}x${canvas.height}`, 'info');
    }
    resizeCanvas();

    // 测试基础绘制
    debugLog('🎨 测试基础绘制...', 'info');
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(50, 50, 100, 100);
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(200, 50, 100, 100);
    ctx.fillStyle = '#0000ff';
    ctx.fillRect(350, 50, 100, 100);
    debugLog('✅ RGB色块绘制完成', 'success');

    // 导入并初始化游戏
    try {
      debugLog('📦 导入游戏模块...', 'info');

      const { gameState } = await import('./src/data/gameState.js');
      debugLog('✅ gameState模块加载成功', 'success');

      const { player, initControls } = await import('./src/game/player.js');
      debugLog('✅ player模块加载成功', 'success');

      const renderer = await import('./src/game/renderer.js');
      debugLog('✅ renderer模块加载成功', 'success');

      // 初始化控制
      initControls();
      debugLog('✅ 控制系统初始化完成', 'success');

      // 初始化雨滴和NPC
      renderer.initRain(canvas.width, canvas.height);
      debugLog('✅ 雨滴系统初始化完成', 'success');

      renderer.initNPCs();
      debugLog('✅ NPC系统初始化完成', 'success');

      // 开始渲染循环
      debugLog('🎬 启动渲染循环...', 'info');

      let frameCount = 0;
      function gameLoop() {
        // 清屏
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 渲染天空
        renderer.renderFarSky(ctx, canvas);

        // 渲染世界
        renderer.renderMidgroundWorld(ctx, canvas);

        // 渲染雨
        renderer.renderRainForeground(ctx, canvas);

        frameCount++;
        if (frameCount === 1) {
          debugLog('✅ 第一帧渲染完成！', 'success');
        }
        if (frameCount === 60) {
          debugLog('✅ 60帧渲染完成，游戏运行正常', 'success');
        }

        requestAnimationFrame(gameLoop);
      }

      gameLoop();
      debugLog('🎉 游戏初始化完成！', 'success');

    } catch (err) {
      debugLog(`❌ 错误: ${err.message}`, 'error');
      debugLog(`堆栈: ${err.stack}`, 'error');
    }

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
